<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>
    <!-- Header: Containing the main title of the page -->
    <header>
        <h1>Homepage</h1>
    </header>
    <!-- Main: Containing the unique and main content of the website -->
    <main>
        <a href="https://theodinproject.com">About The Odin Project1</a>
        <a href="https://theodinproject.com" target="_blank" rel="noreferrer">About The Odin Project2</a>
        <a href="pages/about.html">About</a>
        <!--
        <a>...</a> : Ancor Tag, create a clickable hyperlink
        href="..." : Url Destination
        target="_blank" : Open the link in a new window
        rel="noreferrer" : noopener + no info where the visitor came from (security, outdated)
        rel="noopener" : Protection for phishing (security, outdated), Prevents the new tab from accessing the original page

        Absolute links : Links to pages on other websites on the internet, sheme + domain name, https = scheme + ://://theodinproject.com = domain name (/about = path to resource)
        Relative links : Links to pages located on our own websites, path to resource + name file
        -->
        <img src="https://://theodinproject.com/mstile-310x310.png" alt="The Odin Project Logo" height="310" width="310">
        <img src="./images/cat.jpg" alt="cat" height="310" width="310">
        <!--
        Absolute path we can display an image located on website, exemple on the site ://theodinproject.com...
        Relativ path to display images on your website that are hosted on your own web server

        Alt : Images description
        height="310" width="310 : not strictly required but recommanded, specifying height and width
        syntaxe .. : pointer to the parent directory
        navigate up through multiple directories, use multiple .. references
        exemple = img src = element, alt= = atribut, content = ./images/cat.jpg

        commit github = Describe the problem your commit solves and how
        -->
    </main>
    <!-- Footer: The bottom containing credits and copyright links -->
    <footer>
        <p>&copy; 2026 - My First Webpage. All rights reserved.</p>
    </footer>
</body>
</html>
